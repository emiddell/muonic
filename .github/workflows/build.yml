name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: muonic-linux
          - os: macos-latest
            artifact: muonic-macos
          - os: windows-latest
            artifact: muonic-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync
      - run: uv run pyinstaller muonic.spec
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/muonic/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Zip dist directories
        run: |
          cd artifacts
          for dir in */; do zip -r "${dir%/}-${{ github.ref_name }}.zip" "$dir"; done

      - run: gh release create "${{ github.ref_name }}" artifacts/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
