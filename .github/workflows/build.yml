name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: muonic-linux
            archive_ext: tar.gz
          - os: macos-latest
            artifact: muonic-macos
            archive_ext: tar.gz
          - os: windows-latest
            artifact: muonic-windows
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync
      - run: uv run pyinstaller muonic.spec

      - name: Archive
        shell: bash
        run: |
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar czf ${{ matrix.artifact }}.tar.gz -C dist muonic
          else
            cd dist && zip -r ../${{ matrix.artifact }}.zip muonic/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive_ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Rename with version
        run: |
          cd artifacts
          for f in *; do
            name="${f%%.*}"
            suffix="${f#*.}"
            mv "$f" "${name}-${{ github.ref_name }}.${suffix}"
          done

      - run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
